    <p>
      远山野烧，因逼近薄暮，背景既转成深蓝色，已由一片白烟变成点点红火。……一切光景无不神奇而动人。可是人人都融和在这种光景中，带点快乐和疲倦的心情，等待还家。无一个人能远离这个社会的快乐与疲倦，声音与颜色，来领会赞赏这耳濡目染的新奇。
    </p>
