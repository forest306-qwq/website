# Applied to the existing nwuc.cn server block, preserving its TLS and document root.
auth_request /_forest306_visitor_check;
error_page 401 = /_visitor/welcome;
add_header Cache-Control "private, no-cache" always;

location = /_forest306_visitor_check {
    internal;
    auth_request off;
    # Override the inherited entrance handler: an auth subrequest must keep its 401.
    error_page 401 = @forest306_visitor_denied;
    proxy_pass http://127.0.0.1:8794/_visitor/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    access_log off;
}
location @forest306_visitor_denied {
    auth_request off;
    return 401;
}
location = /_visitor/welcome {
    internal;
    auth_request off;
    proxy_pass http://127.0.0.1:8794;
    proxy_set_header Host $host;
    proxy_cache off;
    access_log off;
}
location = /_visitor/check {
    internal;
    auth_request off;
    return 404;
}
location = /_visitor/admin-login {
    auth_request off;
    limit_req zone=forest306_admin_login burst=3 nodelay;
    limit_req_status 429;
    client_max_body_size 1k;
    proxy_pass http://127.0.0.1:8794;
    proxy_set_header Host $host;
    proxy_cache off;
    access_log off;
}
location = /_visitor/enter {
    auth_request off;
    limit_req zone=forest306_visitor_enter burst=10 nodelay;
    limit_req_status 429;
    client_max_body_size 1k;
    proxy_pass http://127.0.0.1:8794;
    proxy_set_header Host $host;
    proxy_cache off;
    access_log off;
}
location ^~ /_visitor/ {
    auth_request off;
    client_max_body_size 1k;
    proxy_pass http://127.0.0.1:8794;
    proxy_set_header Host $host;
    proxy_cache off;
    access_log off;
}
location = /visitor-admin {
    auth_request off;
    proxy_pass http://127.0.0.1:8794;
    proxy_set_header Host $host;
    proxy_cache off;
    access_log off;
}
# Permit automatic certificate renewal without requiring a visitor nickname.
location ^~ /.well-known/acme-challenge/ {
    auth_request off;
    root /var/www/html;
    try_files $uri =404;
    access_log off;
}
